<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home server - Sandgreenpanda</title>
    <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css">
    <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <ul>
        <li><a href="/">home</a></li>
        <li><a href="/terminal">Terminal</a></li>
        <li><a class="selected" href="/computers">Computers on/off</a></li>
        <li><a class="%LOGGED_IN%" href="/admin">%LOGGED_IN%</a></li>
    </ul>
    <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
    <form action="/toggle1" method="post" target="dummyframe">Toggle HP 1 On/Off    <input type="submit" value="toggle"></form>
    <form action="/toggle2" method="post" target="dummyframe">Toggle HP 2 On/Off    <input type="submit" value="toggle"></form>
    <form action="/toggle3" method="post" target="dummyframe">Toggle Lenovo 1 On/Off<input type="submit" value="toggle"></form>
    <form action="/toggle4" method="post" target="dummyframe">Toggle Acer 1 On/Off  <input type="submit" value="toggle"></form>
    <form action="/toggle5" method="post" target="dummyframe">Toggle Acer 2 On/Off  <input type="submit" value="toggle"></form>
    <form action="/toggle6" method="post" target="dummyframe">Toggle HP 3 On/Off    <input type="submit" value="toggle"></form>
   
    <div class="slidecontainer">
        <input type="range" min="0" max="255" value="0" class="slider" id="fan">
    
    <p>
    <span>Speed: </span><span id="speed">0</span><span> Rpm</span>
    </p>
        
    </div>
    <script>
        const fan = document.getElementById("fan");
        const speed = document.getElementById("speed");

        fan.addEventListener("change", function (event) {
            fetch("/fan", {
                method: "POST",
                body: JSON.stringify(fan.value),
            });
        });


        const socket = new WebSocket(`wss://${window.location.hostname}/webscoketFan`);

        socket.onopen = function (event) {
            alert('You are Connected to WebSocket Fan Server');
        };

        socket.onmessage = function (event) {
            speed.textContent = event.data;
        };

        socket.onclose = function (event) {
            console.log('Disconnected from Fan WebSocket server');
        };

    </script>
</body>

</html>
